<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIJAB - Absensi Guru</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="page active">
        <div class="login-card">
            <h2>🕌 SIJAB Absensi</h2>
            <p>PON-PES DDI MATTOANGING</p>
            <input type="text" id="loginUser" placeholder="Username (NIP atau 'admin')">
            <input type="password" id="loginPass" placeholder="Password">
            <button onclick="handleLogin()">Masuk</button>
            <p id="loginError" class="error"></p>
        </div>
    </div>

    <!-- HALAMAN ADMIN -->
    <div id="adminPage" class="page">
        <header>
            <h3>⚙️ Panel Admin</h3>
            <button onclick="logout()" class="btn-danger">Keluar</button>
        </header>
        <div class="container">
            <div class="card">
                <h4>👤 Kelola Akun Guru</h4>
                <p class="hint">Buat username & password untuk guru berdasarkan data NIP di SIJAB.</p>
                <div class="form-row">
                    <input type="text" id="newNip" placeholder="NIP Guru (sesuai SIJAB)">
                    <input type="text" id="newUser" placeholder="Username Baru">
                    <input type="text" id="newPass" placeholder="Password Baru">
                </div>
                <button onclick="addUser()">+ Tambah Akun Guru</button>
                <table id="userTable">
                    <thead><tr><th>NIP</th><th>Username</th><th>Password</th><th>Aksi</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="card">
                <h4>⚙️ Konfigurasi Spreadsheet</h4>
                <input type="text" id="sheetUrl" placeholder="Tempel URL Apps Script Web App di sini...">
                <button onclick="saveConfig()">Simpan URL</button>
                <p id="configStatus" class="success"></p>
            </div>
        </div>
    </div>

    <!-- HALAMAN GURU -->
    <div id="guruPage" class="page">
        <header>
            <h3 id="guruNameDisplay">Halo, Guru</h3>
            <button onclick="logout()" class="btn-danger">Keluar</button>
        </header>
        <div class="container">
            <div class="card schedule-card">
                <h4>📅 Jadwal Mengajar Hari Ini (<span id="todayName"></span>)</h4>
                <div id="scheduleList" class="schedule-list">
                    <!-- Jadwal dari SIJAB akan muncul di sini -->
                </div>
            </div>

            <div class="card absen-card">
                <h4>📸 Form Absensi Mengajar</h4>
                <div id="absenError" class="error"></div>
                
                <label>Pilih Jadwal yang akan diajar:</label>
                <select id="absenJadwalSelect"></select>
                
                <label>Foto Selfie (Wajib):</label>
                <input type="file" id="fotoInput" accept="image/*" capture="user" onchange="previewImage(this)">
                <img id="fotoPreview" class="preview-img">
                
                <label>Keterangan Pembelajaran:</label>
                <textarea id="ketInput" rows="3" placeholder="Contoh: Mengajar Bab 1, materi berjalan lancar..."></textarea>
                
                <button onclick="submitAbsensi()" class="btn-success">Kirim Absensi</button>
                <p id="absenStatus" class="success"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
